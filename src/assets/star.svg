<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <g transform="translate(350,350)">
    <!-- 12 full spokes at 30° intervals, each rect centered on origin (-155 to +155) -->
    <rect x="-14" y="-155" width="28" height="310" rx="4" fill="white" transform="rotate(0)"/>
    <rect x="-14" y="-155" width="28" height="310" rx="4" fill="white" transform="rotate(30)"/>
    <rect x="-14" y="-155" width="28" height="310" rx="4" fill="white" transform="rotate(60)"/>
    <rect x="-14" y="-155" width="28" height="310" rx="4" fill="white" transform="rotate(90)"/>
    <rect x="-14" y="-155" width="28" height="310" rx="4" fill="white" transform="rotate(120)"/>
    <rect x="-14" y="-155" width="28" height="310" rx="4" fill="white" transform="rotate(150)"/>
  </g>
</svg>
